openapi: 3.1.0
info:
  title: Everything HTTP Server JSON Search API (json=1)
  version: "1.4.0"
  contact:
    name: Takashi Sasaki
    url: https://x.com/TakashiSasaki
  description: |
    voidtools Everything 1.5 の HTTP Server プラグイン（voidtools/http_server）の検索API（JSON出力のみ）。

    重要（実測にもとづく）:
    - size は 10 進数の「文字列」として返る（例: "7699"）。
    - date_modified も 10 進数の「文字列」として返る（例: "133754350660000000"）。
    - date_modified は Everything SDK が扱う FILETIME と整合的（1601-01-01 UTC 起点の 100ns tick）。
      Unix 秒への変換例:
        unix_seconds = (filetime - 116444736000000000) / 10000000

    注意:
    - README には date_created_column が登場するが、作成者環境の実測では date_created は返らなかった。
      実装/バージョン差で無視される可能性があるため、クライアントは「存在しない前提」で実装するのが安全。

servers:
  - url: http://127.160.164.78:8000
    description: |
      本書の作成者環境。既定(127.0.0.1:80)のポート競合を避けるため、Everything 側設定を変更して使用している。
      一般的な既定値ではないため、あなたの環境に合わせて変更すること。
  - url: http://127.0.0.1:80
    description: |
      既定値（HTTP Server 既定）。ポート80は競合しやすいので、必要に応じて Everything 側設定で変更する。

paths:
  /:
    get:
      operationId: searchJson
      summary: Search indexed files/folders (JSON only)
      description: |
        Everything のインデックスを検索し、JSONを返す（json=1 固定）。

        - search は Everything の検索構文を受け付ける。
        - *_column=1 のとき、対応するフィールドが results 要素に追加されうる。
        - size/date_modified は「10進整数文字列」として返ることがある（作成者環境で実測）。
      security:
        - {}
        - basicAuth: []

      parameters:
        - name: search
          in: query
          required: false
          description: |
            検索文字列。Everything の検索構文に従う。
            URLクエリとして送るため、予約文字（&, +, 空白, " など）を含む場合は URL エンコードすること。
          schema:
            type: string
          examples:
            filename:
              summary: Simple filename search
              value: test.md
            and_query:
              summary: AND search (space)
              value: "ABC 123"
            phrase_path:
              summary: Phrase search with a Windows path
              value: "\"C:\\Program Files\\nodejs\""

        - name: offset
          in: query
          required: false
          description: 返却開始位置（0-based）。
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0

        - name: count
          in: query
          required: false
          description: |
            返却する最大件数。
            README の既定例では json=1 のとき非常に大きい値（2^32-1 相当）が使われる。
            API用途では明示指定を推奨。
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 4294967295
            default: 4294967295
          examples:
            typical:
              summary: Typical API paging size
              value: 100

        - name: json
          in: query
          required: true
          description: JSONモード指定。本仕様では 1 固定。
          schema:
            type: integer
            enum: [1]
            default: 1

        - name: path_column
          in: query
          required: false
          description: 結果要素に path を含める（1=ON, 0=OFF）。
          schema:
            type: integer
            enum: [0, 1]
            default: 0

        - name: size_column
          in: query
          required: false
          description: 結果要素に size を含める（1=ON, 0=OFF）。
          schema:
            type: integer
            enum: [0, 1]
            default: 0

        - name: date_modified_column
          in: query
          required: false
          description: 結果要素に date_modified を含める（1=ON, 0=OFF）。
          schema:
            type: integer
            enum: [0, 1]
            default: 0

        - name: date_created_column
          in: query
          required: false
          description: |
            README には存在するが、作成者環境の実測では date_created は返らなかった。
            実装/バージョン差で無視される可能性がある（1=ON, 0=OFF）。
          schema:
            type: integer
            enum: [0, 1]
            default: 0

        - name: case
          in: query
          required: false
          description: "大文字小文字を区別（別名 `i`）。1=ON, 0=OFF。"
          schema: { type: integer, enum: [0, 1], default: 0 }
        - name: i
          in: query
          required: false
          deprecated: true
          description: "`case` の短縮名（互換用）。"
          schema: { type: integer, enum: [0, 1] }

        - name: wholeword
          in: query
          required: false
          description: "単語単位マッチ（別名 `w`）。"
          schema: { type: integer, enum: [0, 1], default: 0 }
        - name: w
          in: query
          required: false
          deprecated: true
          description: "`wholeword` の短縮名（互換用）。"
          schema: { type: integer, enum: [0, 1] }

        - name: path
          in: query
          required: false
          description: "フルパスも検索対象（別名 `p`）。"
          schema: { type: integer, enum: [0, 1], default: 0 }
        - name: p
          in: query
          required: false
          deprecated: true
          description: "`path` の短縮名（互換用）。"
          schema: { type: integer, enum: [0, 1] }

        - name: regex
          in: query
          required: false
          description: "正規表現検索（別名 `r`）。"
          schema: { type: integer, enum: [0, 1], default: 0 }
        - name: r
          in: query
          required: false
          deprecated: true
          description: "`regex` の短縮名（互換用）。"
          schema: { type: integer, enum: [0, 1] }

        - name: diacritics
          in: query
          required: false
          description: "ダイアクリティカルマークを区別（別名 `m`）。"
          schema: { type: integer, enum: [0, 1], default: 0 }
        - name: m
          in: query
          required: false
          deprecated: true
          description: "`diacritics` の短縮名（互換用）。"
          schema: { type: integer, enum: [0, 1] }

        - name: attributes_column
          in: query
          required: false
          description: |
            結果要素に attributes を含める（1=ON, 0=OFF）。
            注: 書者環境では date_created 同様、返却されないケースが観測された。
          schema: { type: integer, enum: [0, 1], default: 0 }

        - name: sort
          in: query
          required: false
          description: ソートキー。
          schema:
            type: string
            enum: [name, path, date_modified, size]
            default: name

        - name: ascending
          in: query
          required: false
          description: 昇順(1) / 降順(0)。
          schema:
            type: integer
            enum: [0, 1]
            default: 1

      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              examples:
                observed_with_columns:
                  summary: Observed output (path/size/date_modified columns enabled)
                  value:
                    totalResults: 10
                    results:
                      - type: file
                        name: npm-install-ci-test.md
                        path: "C:\\Program Files\\nodejs\\node_modules\\npm\\docs\\content\\commands"
                        size: "7699"
                        date_modified: "133754350660000000"
                      - type: file
                        name: npm-install-ci-test.md
                        path: "C:\\Users\\takas\\AppData\\Roaming\\npm\\node_modules\\npm\\docs\\content\\commands"
                        size: "7428"
                        date_modified: "134093252010785768"
        "401":
          description: Unauthorized (HTTP Server の設定で username/password が有効な場合)

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    SearchResponse:
      type: object
      additionalProperties: true
      required: [totalResults, results]
      properties:
        totalResults:
          type: integer
          format: int64
          minimum: 0
          description: ヒット総数。
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"

    SearchResultItem:
      type: object
      additionalProperties: true
      required: [type, name]
      properties:
        type:
          type: string
          enum: [file, folder]
          description: 結果の種別。
        name:
          type: string
          description: ファイル名またはフォルダ名。

        path:
          type: string
          description: |
            結果のパス（ディレクトリ部分）。
            path_column=1 のときに含まれうる。

        size:
          description: |
            サイズ。size_column=1 のときに含まれうる。
            作成者環境の実測では「10進整数の文字列」（例: "7699"）として返った。
            クライアントは uint64 としてパースすること。
          oneOf:
            - type: string
              pattern: "^[0-9]+$"
            - type: integer
              format: int64
              minimum: 0

        date_modified:
          type: string
          pattern: "^[0-9]+$"
          description: |
            更新日時。date_modified_column=1 のときに含まれうる。
            作成者環境の実測では「10進整数の文字列」として返った。
            Everything SDK の FILETIME（1601-01-01 UTC 起点の 100ns tick）と整合的な値域。
            変換例:
              unix_seconds = (filetime - 116444736000000000) / 10000000

        date_created:
          type: string
          pattern: "^[0-9]+$"
          deprecated: true
          description: |
            作成日時。README には date_created_column があるが、作成者環境の実測では返らなかった。
            実装/バージョン差で出ない可能性が高いので、存在しない前提で扱うのが安全。
